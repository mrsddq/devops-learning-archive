name: Docker Smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - devops_toolkit/**
      - scripts/**
      - tests/**
      - .github/workflows/docker-smoke.yml
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - devops_toolkit/**
      - scripts/**
      - tests/**
      - .github/workflows/docker-smoke.yml

permissions:
  contents: read

jobs:
  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t devops-learning-archive:smoke .
      - name: Run audit in Docker
        run: docker run --rm devops-learning-archive:smoke
      - name: Run tests in Docker
        run: docker run --rm devops-learning-archive:smoke python -m unittest discover -s tests
